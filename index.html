<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
	
    <title>MyProfile</title>
    <base href="/MyProfile/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="MyProfile.styles.css" rel="stylesheet" />
	
	<link href="css/site.css" rel="stylesheet" />
	<link href="css/pageStyles.css" rel="stylesheet" />
	<link href="Assets/particles.js-master/demo/css/style.css" rel="stylesheet" />
</head>

<body>

	<div class="animation-wrapper">
				<div class="particle particle-1"></div>
				<div class="particle particle-2"></div>
				<div class="particle particle-3"></div>
				<div class="particle particle-4"></div>
	</div>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>


	<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
	<script type="text/javascript">
	  (function () {
		emailjs.init( "YHuVRihLDuzBj4yJD");
	  })();
	</script>

	
	
	<script>
		window.registerModalClickHandler = function (modalId, dotNetHelper) {
			window.onclick = function (event) {
				const modal = document.getElementById(modalId);
				if (event.target === modal) {
					dotNetHelper.invokeMethodAsync("CloseModalFromJS");
				}
			};
		};
	</script>

	<script src="Assets/particles.js-master/particles.js"></script>

	<script src="Assets/particles.js-master/demo/js/app.js"></script>
	<script src="js/modal.js"></script>
	<script src="js/emailInterop.js"></script>

    <script src="_framework/blazor.webassembly.js"></script>
	

</body>

</html>
